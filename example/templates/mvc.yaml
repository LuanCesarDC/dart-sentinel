# ============================================================
# Dart Sentinel — MVC (Model-View-Controller)
# ============================================================
# Arquitetura clássica MVC para apps simples ou médios.
#
# Estrutura esperada:
#   lib/
#     core/              ← Constantes, theme, utils
#     models/            ← Data classes, entidades
#     views/             ← Telas e widgets
#     controllers/       ← Lógica de negócio / mediação
#     services/          ← API, storage, auth
# ============================================================

exclude:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*.mocks.dart"

rules:
  dead-files: warning
  dead-exports: warning
  banned-imports: error
  layer-dependency: error
  import-cycles: warning
  complexity: warning
  build-complexity: warning
  dispose-check: warning
  async-safety: warning
  empty-catch: warning
  dead-todos: info
  generic-naming: warning
  redundant-comments: info
  verbose-logging: info
  single-method-class: info
  passthrough-function: info

architecture:
  layers:
    view:
      paths: ["lib/views/**", "lib/widgets/**"]
      can_depend_on: ["controller", "model", "core"]
    controller:
      paths: ["lib/controllers/**"]
      can_depend_on: ["service", "model", "core"]
    service:
      paths: ["lib/services/**"]
      can_depend_on: ["model", "core"]
    model:
      paths: ["lib/models/**"]
      can_depend_on: ["core"]
    core:
      paths: ["lib/core/**"]
      can_depend_on: []

  banned_imports:
    # Controllers não usam widgets Flutter
    - paths: ["lib/controllers/**"]
      deny: ["package:flutter/material.dart", "package:flutter/widgets.dart", "package:flutter/cupertino.dart"]
      message: "Controllers não devem importar widgets Flutter."
    # Services são puros
    - paths: ["lib/services/**"]
      deny: ["package:flutter/**"]
      message: "Services devem ser puros — sem dependência de Flutter."
    # Models são puros
    - paths: ["lib/models/**"]
      deny: ["package:flutter/**"]
      message: "Models devem ser puros."

metrics:
  cyclomatic_complexity:
    warning: 10
    error: 20
  lines_per_file:
    warning: 300
    error: 600
  lines_per_method:
    warning: 50
    error: 100
  max_parameters:
    warning: 5
    error: 8
  max_nesting:
    warning: 4
    error: 6
  build_method_branches:
    warning: 4
    error: 8
