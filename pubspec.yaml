name: dart_sentinel
description: >
  Static analysis and metrics tool for Dart/Flutter projects.
  Detects dead files, enforces architecture rules, computes metrics, and applies custom lint rules.
version: 0.6.2
homepage: https://github.com/LuanCesarDC/dart-sentinel
repository: https://github.com/LuanCesarDC/dart-sentinel
issue_tracker: https://github.com/LuanCesarDC/dart-sentinel/issues
topics:
  - linter
  - static-analysis
  - architecture
  - metrics

executables:
  dart_sentinel: dart_sentinel
  mcp_server: mcp_server

environment:
  sdk: ^3.11.0

dependencies:
  analysis_server_plugin: ^0.3.24
  analyzer: ^14.5.0
  analyzer_plugin: ^0.14.18
  args: ^2.4.0
  dart_mcp: ^0.5.0
  path: ^1.8.0
  stream_channel: ^2.1.0
  yaml: ^3.1.0

dev_dependencies:
  analyzer_testing: ^0.4.3
  test: ^1.24.0
  test_reflective_loader: ">=0.4.0 <0.7.0"
