name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: dart test

      - name: Run Dart Sentinel
        run: dart run dart_sentinel

  # Run the published constraint range against its oldest and newest analyzer
  # so an analyzer bump can't silently break the package.
  analyzer-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        analyzer: ["10.0.0", "any"]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Pin analyzer
        if: matrix.analyzer != 'any'
        run: |
          printf 'dependency_overrides:\n  analyzer: %s\n' "${{ matrix.analyzer }}" >> pubspec.yaml
      - run: dart pub get
      - run: dart test
